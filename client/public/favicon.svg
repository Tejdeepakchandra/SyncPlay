<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  
  <!-- Subtle inner shadow/shine -->
  <rect width="512" height="512" rx="108" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  
  <!-- Sync ring (outer) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="14" stroke-dasharray="80 40"/>
  
  <!-- Sync ring (inner) -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8" stroke-dasharray="50 30"/>
  
  <!-- Play button triangle -->
  <path d="M 210 160 L 210 352 L 368 256 Z" fill="url(#play)" filter="url(#glow)"/>
  
  <!-- Sync dots (connected users) -->
  <circle cx="256" cy="78" r="16" fill="rgba(255,255,255,0.85)"/>
  <circle cx="415" cy="320" r="16" fill="rgba(255,255,255,0.85)"/>
  <circle cx="97" cy="320" r="16" fill="rgba(255,255,255,0.85)"/>
</svg>
