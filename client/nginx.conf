# ============================================
# Nginx Config for SyncPlay Frontend
# ============================================
# This tells Nginx HOW to serve the React app.
# React is a Single Page App (SPA), so ALL routes
# like /friends, /movies, /profile must return index.html
# and let React Router handle the routing.
# ============================================

server {
    listen 80;
    server_name localhost;

    # Where the built React files are stored
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files (JS, CSS, images) with caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # For ALL other routes, serve index.html
    # This is CRITICAL for React Router to work!
    # Without this, /friends would return 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression (makes files smaller = faster loading)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
}
